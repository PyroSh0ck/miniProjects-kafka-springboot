spring.application.name=stock-service
server.port=8081
# Configure this as a consumer for the Kafka broker running on port 9092
spring.kafka.consumer.bootstrap-servers: localhost:9092
# Defines the consumer group so that we can have multiple consumers for the topic
spring.kafka.consumer.group-id: stock
# To get all messages sent to the kafka broker
spring.kafka.consumer.auto-offset-reset: earliest
# Deserializers for the key and value (obviously we use the spring json 
# deserializer since kafka doesn't suppport them by default)
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
# Tell kafka to trust the json deserialization packages automatically
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Make sure that this is the same topic name that we listed way back for order-service
spring.kafka.topic.name=order_topics

